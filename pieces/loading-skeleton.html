<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading skeleton</title>
<style>
  :root { --ink: #1f2430; --base: #e6e9ef; --shine: #f6f7fa; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: var(--ink); font-family: system-ui, sans-serif; }
  .wrap { width: min(360px, 92vw); }
  .profile { display: flex; gap: 14px; align-items: center; padding: 16px; border: 1px solid #e3e6ec; border-radius: 14px; }
  .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #2b5fd0; color: #fff; display: grid; place-items: center; font-weight: 700; }
  .lines { flex: 1; }
  .lines strong { display: block; }
  .lines span { color: #5b6572; font-size: 0.9rem; }
  /* While loading, real text turns transparent and a shimmer gradient shows instead. */
  .is-loading .avatar, .is-loading .lines > * { color: transparent; background: linear-gradient(100deg, var(--base) 30%, var(--shine) 50%, var(--base) 70%) 0 0 / 200% 100%; border-radius: 6px; animation: shimmer 1.2s linear infinite; user-select: none; }
  .is-loading .avatar { border-radius: 50%; }
  .is-loading .lines > * { display: block; margin-bottom: 8px; }
  button { margin-top: 14px; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: inherit; cursor: pointer; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .is-loading .avatar, .is-loading .lines > * { animation: none; background: var(--base); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="profile is-loading" id="profile" aria-busy="true">
    <div class="avatar">MR</div>
    <div class="lines"><strong>Maria Reyes</strong><span>Owner, Reyes Plumbing</span></div>
  </div>
  <button type="button" id="reload">Reload</button>
</div>
<script>
  const profile = document.getElementById('profile');

  function load() {
    profile.classList.add('is-loading');
    profile.setAttribute('aria-busy', 'true');
    setTimeout(() => { // stand-in for a real fetch
      profile.classList.remove('is-loading');
      profile.setAttribute('aria-busy', 'false');
    }, 1800);
  }

  document.getElementById('reload').addEventListener('click', load);
  load();
</script>
</body>
</html>
