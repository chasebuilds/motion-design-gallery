<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated gradient background</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #1b1f3a; color: #fff; font-family: system-ui, sans-serif; }
  /* Blurred blobs move with transform only, so the browser can animate them on the GPU. */
  .blob { position: fixed; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(60px); opacity: 0.75; will-change: transform; }
  .b1 { background: #ff6b6b; top: -25vmax; left: -15vmax; animation: drift1 16s ease-in-out infinite alternate; }
  .b2 { background: #4d7cff; bottom: -30vmax; right: -20vmax; animation: drift2 20s ease-in-out infinite alternate; }
  .b3 { background: #36d6b5; top: 10vmax; left: 25vmax; width: 40vmax; height: 40vmax; animation: drift3 24s ease-in-out infinite alternate; }
  .content { position: relative; text-align: center; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 6vw, 2.6rem); }
  p { margin: 0; }
  @keyframes drift1 { to { transform: translate(30vmax, 20vmax) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-25vmax, -15vmax) scale(0.9); } }
  @keyframes drift3 { to { transform: translate(-20vmax, 25vmax) scale(1.3); } }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>
<main class="content">
  <h1>Slow, calm color</h1>
  <p>Three blurred shapes drifting behind your content.</p>
</main>
</body>
</html>
