<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliding tab indicator</title>
<style>
  :root { --ink: #1f2430; --accent: #be185d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fdf2f8; color: var(--ink); font-family: system-ui, sans-serif; }
  .tabs { width: min(420px, 92vw); }
  [role="tablist"] { position: relative; display: flex; border-bottom: 2px solid #f1cfe0; }
  [role="tab"] { flex: 1; padding: 12px 8px; border: 0; background: none; color: #6b7380; font: inherit; cursor: pointer; }
  [role="tab"][aria-selected="true"] { color: var(--accent); font-weight: 600; }
  [role="tab"]:focus-visible { outline: 3px solid #f4a6c8; outline-offset: -3px; }
  /* One bar, moved with transform and scaleX so only the compositor does the work. */
  .bar { position: absolute; left: 0; bottom: -2px; width: 100px; height: 3px; background: var(--accent); transform-origin: left; transform: translateX(var(--x, 0)) scaleX(var(--s, 1)); transition: transform 0.3s cubic-bezier(0.3, 0.7, 0.2, 1); }
  [role="tabpanel"] { padding: 20px 4px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) {
    .bar { transition: none; }
  }
</style>
</head>
<body>
<div class="tabs">
  <div role="tablist" aria-label="Menu sections" id="list">
    <button type="button" role="tab" id="t1" aria-controls="p1" aria-selected="true">Lunch</button>
    <button type="button" role="tab" id="t2" aria-controls="p2" aria-selected="false" tabindex="-1">Dinner</button>
    <button type="button" role="tab" id="t3" aria-controls="p3" aria-selected="false" tabindex="-1">Drinks</button>
    <span class="bar" id="bar"></span>
  </div>
  <div role="tabpanel" id="p1" aria-labelledby="t1">Soups, sandwiches and a daily special.</div>
  <div role="tabpanel" id="p2" aria-labelledby="t2" hidden>Three-course set menu and a short wine list.</div>
  <div role="tabpanel" id="p3" aria-labelledby="t3" hidden>Coffee, tea, fresh juice and local beer.</div>
</div>
<script>
  const list = document.getElementById('list');
  const tabs = [...list.querySelectorAll('[role="tab"]')];
  const bar = document.getElementById('bar');

  function moveBar(tab) {
    bar.style.setProperty('--x', `${tab.offsetLeft}px`);
    bar.style.setProperty('--s', tab.offsetWidth / 100);
  }

  function select(tab) {
    tabs.forEach((t) => {
      const on = t === tab;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    moveBar(tab);
  }

  tabs.forEach((t) => t.addEventListener('click', () => select(t)));
  list.addEventListener('keydown', (e) => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0 || !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    next.focus();
    select(next);
  });
  window.addEventListener('resize', () => moveBar(tabs.find((t) => t.getAttribute('aria-selected') === 'true')));
  moveBar(tabs[0]);

  // Demo mode: play by itself until the visitor touches it. Off when reduced motion is on.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let auto = setInterval(() => { const i = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true'); select(tabs[(i + 1) % tabs.length]); }, 1800);
    const stop = () => { clearInterval(auto); auto = 0; };
    addEventListener('pointerdown', stop, { once: true }); addEventListener('keydown', stop, { once: true });
    
  }
</script>
</body>
</html>
