<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas particle header</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f172a; color: #fff; font-family: system-ui, sans-serif; }
  .header { position: relative; height: 100vh; min-height: 220px; display: grid; place-items: center; text-align: center; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy { position: relative; padding: 20px; pointer-events: none; }
  h1 { margin: 0 0 6px; font-size: clamp(1.6rem, 6vw, 2.6rem); }
  p { margin: 0; color: #cbd5e1; }
</style>
</head>
<body>
<header class="header">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="copy">
    <h1>Connected, quietly</h1>
    <p>About 60 dots, light lines, pointer pushes them away.</p>
  </div>
</header>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINK = 110; // max distance for a line between two dots
  let w = 0;
  let h = 0;
  let dots = [];
  let running = false;
  const pointer = { x: -999, y: -999 };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(70, (w * h) / 9000));
    dots = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const d of dots) {
      const px = d.x - pointer.x;
      const py = d.y - pointer.y;
      const dist = Math.hypot(px, py);
      if (dist < 90 && dist > 0) { // push away from the pointer
        d.x += (px / dist) * 1.5;
        d.y += (py / dist) * 1.5;
      }
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
    }
    for (let i = 0; i < dots.length; i++) {
      ctx.fillStyle = '#7dd3fc';
      ctx.beginPath();
      ctx.arc(dots[i].x, dots[i].y, 2, 0, Math.PI * 2);
      ctx.fill();
      for (let j = i + 1; j < dots.length; j++) {
        const d = Math.hypot(dots[i].x - dots[j].x, dots[i].y - dots[j].y);
        if (d < LINK) {
          ctx.strokeStyle = `rgba(125, 211, 252, ${(1 - d / LINK) * 0.5})`;
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.stroke();
        }
      }
    }
  }

  function loop() {
    if (!running) return;
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    if (running || reduce) return;
    running = true;
    requestAnimationFrame(loop);
  }

  resize();
  draw(); // one still frame; this is all reduced-motion users get
  window.addEventListener('resize', () => { resize(); draw(); });
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
  });
  canvas.addEventListener('pointerleave', () => { pointer.x = -999; pointer.y = -999; });
  // Pause when scrolled offscreen or the tab is hidden, so it costs nothing then.
  new IntersectionObserver(([e]) => { if (e.isIntersecting) start(); else running = false; }).observe(canvas);
  document.addEventListener('visibilitychange', () => { if (document.hidden) running = false; else start(); });
</script>
</body>
</html>
