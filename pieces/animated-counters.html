<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated counters</title>
<style>
  :root { --ink: #1f2430; --accent: #7b4fd1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f2fc; color: var(--ink); font-family: system-ui, sans-serif; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; width: min(560px, 92vw); }
  .stat { padding: 20px 12px; border-radius: 14px; background: #fff; text-align: center; box-shadow: 0 6px 20px rgb(31 36 48 / 8%); }
  .num { display: block; font-size: 2.2rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .label { font-size: 0.85rem; color: #5b6572; }
  .note { grid-column: 1 / -1; margin: 0; text-align: center; font-size: 0.75rem; color: #6b7380; }
</style>
</head>
<body>
<div class="stats">
  <div class="stat"><span class="num" data-to="1240">1,240</span><span class="label">Jobs finished</span></div>
  <div class="stat"><span class="num" data-to="98" data-suffix="%">98%</span><span class="label">On-time rate</span></div>
  <div class="stat"><span class="num" data-to="4.9" data-decimals="1">4.9</span><span class="label">Average rating</span></div>
  <p class="note">Sample figures for the demo.</p>
</div>
<script>
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function format(el, value) {
    const decimals = Number(el.dataset.decimals || 0);
    el.textContent = value.toLocaleString('en-US', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals,
    }) + (el.dataset.suffix || '');
  }

  function count(el) {
    const to = Number(el.dataset.to);
    if (reduce) return format(el, to);
    const duration = 1600;
    const start = performance.now();
    function tick(now) {
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
      format(el, to * eased);
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      count(e.target);
      io.unobserve(e.target);
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('.num').forEach((el) => io.observe(el));
</script>
</body>
</html>
