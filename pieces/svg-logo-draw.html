<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG logo line drawing</title>
<style>
  :root { --ink: #1f2430; --accent: #c2410c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8f1; color: var(--ink); font-family: system-ui, sans-serif; text-align: center; }
  svg { width: 200px; height: 200px; overflow: visible; }
  /* pathLength="1" on each path lets us use 1 as the full length, whatever its real size. */
  .draw { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .play .draw { animation: draw 1.4s ease forwards; animation-delay: calc(var(--i) * 0.35s); }
  .fill { fill: var(--accent); opacity: 0; }
  .play .fill { animation: pop 0.5s ease 1.9s forwards; }
  .name { margin: 8px 0 0; font-weight: 700; letter-spacing: 0.12em; opacity: 0; }
  .play .name { animation: pop 0.6s ease 2s forwards; }
  button { margin-top: 18px; padding: 8px 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: inherit; cursor: pointer; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .draw { stroke-dashoffset: 0; animation: none; }
    .fill, .name { opacity: 1; animation: none; }
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" role="img" aria-label="Harbor and Co logo">
    <path class="draw" style="--i: 0" pathLength="1" d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z" />
    <path class="draw" style="--i: 1" pathLength="1" d="M26 64 Q38 52 50 64 T74 64" />
    <path class="draw" style="--i: 2" pathLength="1" d="M50 34 L50 72 M40 44 L60 44" />
    <circle class="fill" cx="50" cy="26" r="5" />
  </svg>
  <p class="name">HARBOR &amp; CO</p>
  <button type="button" id="replay">Replay</button>
</main>
<script>
  const root = document.documentElement;
  function play() {
    root.classList.remove('play');
    void root.offsetWidth; // reflow so the animations restart
    root.classList.add('play');
  }
  document.getElementById('replay').addEventListener('click', play);
  play();
</script>
</body>
</html>
