<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card hover tilt</title>
<style>
  :root { --ink: #1f2430; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2f9; color: var(--ink); font-family: system-ui, sans-serif; }
  .scene { perspective: 800px; }
  .card { position: relative; width: 260px; padding: 28px 22px; border-radius: 18px; background: linear-gradient(135deg, #3b6fe0, #6a4fd1); color: #fff; box-shadow: 0 16px 36px rgb(59 111 224 / 35%); transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.35s ease; will-change: transform; }
  .card.is-active { transition: transform 0.08s linear; }
  .card h2 { margin: 0 0 8px; }
  .card p { margin: 0; line-height: 1.45; }
  /* Soft glare that follows the pointer. */
  .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgb(255 255 255 / 35%), transparent 55%); transition: opacity 0.3s; }
  .card.is-active::after { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.is-active { transform: none; transition: none; }
    .card::after { display: none; }
  }
</style>
</head>
<body>
<div class="scene">
  <article class="card" id="card">
    <h2>Starter plan</h2>
    <p>Hover or touch the card. It leans toward your pointer.</p>
  </article>
</div>
<script>
  const card = document.getElementById('card');
  const MAX = 12; // degrees
  let frame = 0;

  card.addEventListener('pointermove', (e) => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      card.classList.add('is-active');
      card.style.setProperty('--ry', `${(x - 0.5) * 2 * MAX}deg`);
      card.style.setProperty('--rx', `${(0.5 - y) * 2 * MAX}deg`);
      card.style.setProperty('--gx', `${x * 100}%`);
      card.style.setProperty('--gy', `${y * 100}%`);
    });
  });

  card.addEventListener('pointerleave', () => {
    cancelAnimationFrame(frame);
    card.classList.remove('is-active');
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
  });
</script>
</body>
</html>
